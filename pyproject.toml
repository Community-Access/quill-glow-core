[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "quill-glow-core"
version = "0.1.1"
description = "Shared audit/fix/convert service contracts for GLOW and QUILL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Community Access" },
  { name = "Blind Information Technology Solutions (BITS)" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]
glow = [
  "acb-large-print>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quill_glow_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
